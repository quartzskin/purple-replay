title: regsvr32 loading a remote scriptlet
id: pr-0010
level: high
tags:
  - attack.defense_evasion
  - attack.t1218.010
logsource:
  category: process_creation
detection:
  selection:
    Image|endswith: '\regsvr32.exe'
    CommandLine|re: '/i:https?://\S+\s+.*scrobj(\.dll)?'
  condition: selection
