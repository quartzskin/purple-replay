title: PowerShell encoded command
id: pr-0001
description: powershell.exe started with an encoded command argument
level: medium
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  category: process_creation
detection:
  selection_img:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_flag:
    CommandLine|contains:
      - ' -enc '
      - ' -encodedcommand '
      - ' -ec '
  condition: selection_img and selection_flag
