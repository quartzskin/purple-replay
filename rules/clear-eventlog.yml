title: Event log cleared with wevtutil
id: pr-0006
level: high
tags:
  - attack.defense_evasion
  - attack.t1070.001
logsource:
  category: process_creation
detection:
  selection:
    Image|endswith: '\wevtutil.exe'
    CommandLine|contains:
      - ' cl '
      - 'clear-log'
  condition: selection
