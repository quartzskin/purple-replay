<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>purple-replay</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>purple-replay</h1>
  <p class="scope">Lab only. Scenarios are replayed as stored data; nothing is executed and nothing touches the network.</p>
  <div class="actions">
    <button id="replay-all">Replay all</button>
    <button id="reset" class="quiet">Clear results</button>
    <a href="/api/report.md" download>Report (.md)</a>
    <a href="/api/report.json" download>Report (.json)</a>
  </div>
</header>
<main>
  <section id="summary"></section>
  <div class="cols">
    <section>
      <h2>Scenarios</h2>
      <ul id="scenarios" class="list"></ul>
    </section>
    <section>
      <h2>Coverage by technique</h2>
      <table id="coverage"></table>
    </section>
  </div>
  <section>
    <h2>Timeline <select id="filter"><option value="">all scenarios</option></select></h2>
    <table id="timeline"></table>
  </section>
  <section>
    <h2>Rules</h2>
    <ul id="rules" class="list"></ul>
    <ul id="errors" class="errors"></ul>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
